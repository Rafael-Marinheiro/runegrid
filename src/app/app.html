<header class="topbar">
  <a class="brand" routerLink="/">Runegrid</a>
  <nav aria-label="Principal">
    <a routerLink="/criaturas" routerLinkActive="active">Criaturas</a>
    <a routerLink="/combate" routerLinkActive="active">Combate</a>
    <a routerLink="/gerador" routerLinkActive="active">Gerador</a>
    <a routerLink="/estudio" routerLinkActive="active">Estúdio</a>
    <a routerLink="/bestiario" routerLinkActive="active">Bestiário</a>
    <a routerLink="/magias" routerLinkActive="active">Magias</a>
    <a routerLink="/dados" routerLinkActive="active">Dados</a>
    <a routerLink="/mesa" routerLinkActive="active" class="room-link">
      Mesa
      @if (room.online()) {
        <span class="live" aria-label="Sala ativa"
          >● {{ room.code() }} · {{ room.peers().length + 1 }}</span
        >
      }
    </a>
  </nav>
</header>
<main>
  <router-outlet />
</main>

</footer>
