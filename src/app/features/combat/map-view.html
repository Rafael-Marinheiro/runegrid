<div class="wrap">
  <svg
    #svg
    class="map"
    role="group"
    aria-label="Mapa de combate"
    [attr.viewBox]="viewBox()"
    preserveAspectRatio="xMidYMid meet"
    (wheel)="onWheel($event)"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="drag.set(null)"
    (pointerleave)="onLeave()"
  >
    <rect [attr.width]="width()" [attr.height]="height()" class="bg" />

    @for (c of cells(); track c.i) {
      <rect
        [attr.x]="c.x * C"
        [attr.y]="c.y * C"
        [attr.width]="C"
        [attr.height]="C"
        [class]="'tile ' + c.t"
        [class.alt]="(c.x + c.y) % 2 === 1"
      />
      @if (c.t === 'difficult') {
        <g class="rubble" aria-hidden="true">
          <circle [attr.cx]="c.x * C + 12" [attr.cy]="c.y * C + 14" r="2.2" />
          <circle [attr.cx]="c.x * C + 30" [attr.cy]="c.y * C + 12" r="2.2" />
          <circle [attr.cx]="c.x * C + 22" [attr.cy]="c.y * C + 26" r="2.2" />
          <circle [attr.cx]="c.x * C + 36" [attr.cy]="c.y * C + 34" r="2.2" />
          <circle [attr.cx]="c.x * C + 13" [attr.cy]="c.y * C + 38" r="2.2" />
        </g>
      }
      @if (c.t === 'door') {
        <rect
          class="door-leaf"
          [attr.x]="c.x * C + 7"
          [attr.y]="c.y * C + 7"
          [attr.width]="C - 14"
          [attr.height]="C - 14"
          rx="3"
        />
      }
      @if (c.t === 'door-closed' || c.t === 'door-locked') {
        <rect
          class="door-leaf closed"
          [attr.x]="c.x * C + 7"
          [attr.y]="c.y * C + 7"
          [attr.width]="C - 14"
          [attr.height]="C - 14"
          rx="3"
        />
        <path
          class="door-bars"
          [attr.d]="
            'M' +
            (c.x * C + 24) +
            ' ' +
            (c.y * C + 8) +
            'v' +
            (C - 16) +
            'M' +
            (c.x * C + 10) +
            ' ' +
            (c.y * C + 24) +
            'h' +
            (C - 20)
          "
        />
        @if (c.t === 'door-locked') {
          <circle class="lock" [attr.cx]="c.x * C + 24" [attr.cy]="c.y * C + 24" r="5" />
        }
      }
      @if (c.t === 'water') {
        <path
          class="wave"
          [attr.d]="
            'M' +
            (c.x * C + 8) +
            ' ' +
            (c.y * C + 18) +
            'q6 -6 12 0t12 0 M' +
            (c.x * C + 8) +
            ' ' +
            (c.y * C + 32) +
            'q6 -6 12 0t12 0'
          "
        />
      }
    }

    @for (r of reach(); track r.x + ',' + r.y) {
      <rect
        class="reach"
        [attr.x]="r.x * C + 2"
        [attr.y]="r.y * C + 2"
        [attr.width]="C - 4"
        [attr.height]="C - 4"
        rx="4"
      />
    }

    @for (f of fogList(); track f.i) {
      <rect class="fog" [attr.x]="f.x * C" [attr.y]="f.y * C" [attr.width]="C" [attr.height]="C" />
    }

    @for (r of rooms(); track r.id) {
      <g class="room" [class.sel]="r.id === selectedRoom()" aria-hidden="true">
        <rect
          [attr.x]="r.x * C + 2"
          [attr.y]="r.y * C + 2"
          [attr.width]="r.w * C - 4"
          [attr.height]="r.h * C - 4"
          rx="4"
        />
        <text [attr.x]="r.x * C + 8" [attr.y]="r.y * C + 18" font-size="13">{{ r.name }}</text>
      </g>
    }

    @if (draftRect(); as d) {
      <rect
        class="draft"
        [attr.x]="d.x * C + 2"
        [attr.y]="d.y * C + 2"
        [attr.width]="d.w * C - 4"
        [attr.height]="d.h * C - 4"
        rx="4"
      />
    }

    @for (t of visibleTraps(); track t.id) {
      <g
        class="trap"
        [class.hid]="t.hidden && !t.triggered"
        [class.spent]="t.triggered"
        aria-hidden="true"
      >
        <path [attr.d]="'M' + (t.pos.x * C + 24) + ' ' + (t.pos.y * C + 9) + 'l14 26h-28z'" />
        <text
          [attr.x]="t.pos.x * C + 24"
          [attr.y]="t.pos.y * C + 32"
          text-anchor="middle"
          font-size="14"
        >
          !
        </text>
      </g>
    }

    @if (sphere(); as sp) {
      <circle class="aoe" [attr.cx]="sp.cx" [attr.cy]="sp.cy" [attr.r]="sp.r" />
    }
    @if (cone(); as pts) {
      <polygon class="aoe" [attr.points]="pts" />
    }

    @for (t of tokens(); track t.id) {
      @let p = place(t);
      @let d = t.size * C;
      <g
        class="token"
        [class.foe]="t.team === 'foes'"
        [class.hidden]="t.hidden"
        [class.dead]="t.dead"
        [class.dragging]="drag()?.id === t.id && drag()?.moved"
        [attr.transform]="'translate(' + p.x + ' ' + p.y + ')'"
        [attr.data-token]="t.id"
        tabindex="0"
        role="button"
        [attr.aria-label]="label(t)"
        [attr.aria-pressed]="t.selected"
        (keydown)="onKey($event, t)"
      >
        @if (t.active) {
          <circle class="turn" [attr.cx]="d / 2" [attr.cy]="d / 2" [attr.r]="d / 2 + 1" />
        }
        @if (t.targetable) {
          <circle class="target" [attr.cx]="d / 2" [attr.cy]="d / 2" [attr.r]="d / 2" />
        }
        @if (t.selected) {
          <circle class="sel" [attr.cx]="d / 2" [attr.cy]="d / 2" [attr.r]="d / 2 - 1" />
        }
        <circle class="body" [attr.cx]="d / 2" [attr.cy]="d / 2" [attr.r]="d / 2 - 5" />
        <text
          [attr.x]="d / 2"
          [attr.y]="d / 2 + d * 0.13"
          [attr.font-size]="d * 0.42"
          text-anchor="middle"
        >
          {{ t.dead ? '✕' : t.letter }}
        </text>
        <rect
          class="hp-bg"
          [attr.x]="d * 0.2"
          [attr.y]="d - 8"
          [attr.width]="d * 0.6"
          height="5"
          rx="2"
        />
        <rect
          class="hp"
          [class.low]="t.hpPct <= 25"
          [attr.x]="d * 0.2"
          [attr.y]="d - 8"
          [attr.width]="(d * 0.6 * t.hpPct) / 100"
          height="5"
          rx="2"
        />
        @if (t.conditions > 0) {
          <g class="badge" aria-hidden="true">
            <circle [attr.cx]="d - 9" cy="9" r="8" />
            <text [attr.x]="d - 9" y="13" text-anchor="middle" font-size="11">
              {{ t.conditions }}
            </text>
          </g>
        }
        @if (t.concentrating) {
          <circle
            class="focus"
            [attr.cx]="d / 2"
            [attr.cy]="d / 2"
            [attr.r]="d / 2 + 2"
            aria-hidden="true"
          />
        }
      </g>
    }
  </svg>

  <div class="zoom" role="group" aria-label="Zoom do mapa">
    <button type="button" aria-label="Aproximar" (click)="zoomBy(1.25)">+</button>
    <button type="button" aria-label="Afastar" (click)="zoomBy(0.8)">−</button>
    <button type="button" aria-label="Ajustar ao mapa" (click)="reset()">⌂</button>
  </div>
</div>
