<div class="wrap">
  <svg
    #svg
    class="map"
    [class.hc]="highContrast()"
    [class.has-background]="!!map().background"
    role="group"
    [attr.aria-label]="ui.text('Mapa de combate', 'Combat map')"
    [attr.viewBox]="viewBox()"
    preserveAspectRatio="xMidYMid meet"
    (wheel)="onWheel($event)"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerCancel($event)"
    (pointerleave)="onLeave()"
  >
    <defs>
      <pattern id="tex-stone" width="96" height="96" patternUnits="userSpaceOnUse">
        <path
          d="M0 24h34l6 8h30M20 60h28l8 10h40M60 0l-6 24l10 14M12 90l16-14l30 4"
          class="tx-line"
        />
        <circle cx="18" cy="10" r="1.5" class="tx-dot" />
        <circle cx="72" cy="52" r="1.5" class="tx-dot" />
        <circle cx="40" cy="80" r="1.5" class="tx-dot" />
      </pattern>
      <pattern id="tex-cave" width="96" height="96" patternUnits="userSpaceOnUse">
        <ellipse cx="20" cy="22" rx="14" ry="9" class="tx-blob" />
        <ellipse cx="68" cy="14" rx="9" ry="6" class="tx-blob" />
        <ellipse cx="54" cy="62" rx="18" ry="10" class="tx-blob" />
        <ellipse cx="14" cy="76" rx="8" ry="6" class="tx-blob" />
        <ellipse cx="82" cy="82" rx="10" ry="7" class="tx-blob" />
      </pattern>
      <pattern id="tex-grass" width="96" height="96" patternUnits="userSpaceOnUse">
        <path
          d="M10 30l-2-10M14 30l2-12M20 74l-3-11M25 74l2-13M60 40l-2-10M64 40l3-12M78 88l-2-9M82 88l3-10M46 12l-2-8M50 12l2-9"
          class="tx-grass"
        />
      </pattern>
      <pattern id="tex-mud" width="96" height="96" patternUnits="userSpaceOnUse">
        <ellipse cx="24" cy="28" rx="12" ry="5" class="tx-mud" />
        <ellipse cx="70" cy="60" rx="16" ry="6" class="tx-mud" />
        <ellipse cx="36" cy="80" rx="9" ry="4" class="tx-mud" />
        <circle cx="80" cy="18" r="2.5" class="tx-dot" />
        <circle cx="12" cy="58" r="2" class="tx-dot" />
      </pattern>
    </defs>
    <rect [attr.width]="width()" [attr.height]="height()" class="bg" />
    @if (map().background; as image) {
      <image
        class="map-background"
        [attr.href]="image.src"
        [attr.x]="image.offsetX * C"
        [attr.y]="image.offsetY * C"
        [attr.width]="(image.widthPx / image.pixelsPerCell) * C"
        [attr.height]="(image.heightPx / image.pixelsPerCell) * C"
        [attr.opacity]="image.opacity"
        preserveAspectRatio="none"
      />
    }

    @for (c of cells(); track c.i) {
      <rect
        [attr.x]="c.x * C"
        [attr.y]="c.y * C"
        [attr.width]="C"
        [attr.height]="C"
        [class]="'tile ' + c.t"
        [class.alt]="(c.x + c.y) % 2 === 1"
      />
      @if (c.t === 'difficult') {
        <g class="rubble" aria-hidden="true">
          <circle [attr.cx]="c.x * C + 12" [attr.cy]="c.y * C + 14" r="2.2" />
          <circle [attr.cx]="c.x * C + 30" [attr.cy]="c.y * C + 12" r="2.2" />
          <circle [attr.cx]="c.x * C + 22" [attr.cy]="c.y * C + 26" r="2.2" />
          <circle [attr.cx]="c.x * C + 36" [attr.cy]="c.y * C + 34" r="2.2" />
          <circle [attr.cx]="c.x * C + 13" [attr.cy]="c.y * C + 38" r="2.2" />
        </g>
      }
      @if (c.t === 'door') {
        <rect
          class="door-leaf"
          [attr.x]="c.x * C + 7"
          [attr.y]="c.y * C + 7"
          [attr.width]="C - 14"
          [attr.height]="C - 14"
          rx="3"
        />
      }
      @if (c.t === 'door-closed' || c.t === 'door-locked') {
        <rect
          class="door-leaf closed"
          [attr.x]="c.x * C + 7"
          [attr.y]="c.y * C + 7"
          [attr.width]="C - 14"
          [attr.height]="C - 14"
          rx="3"
        />
        <path
          class="door-bars"
          [attr.d]="
            'M' +
            (c.x * C + 24) +
            ' ' +
            (c.y * C + 8) +
            'v' +
            (C - 16) +
            'M' +
            (c.x * C + 10) +
            ' ' +
            (c.y * C + 24) +
            'h' +
            (C - 20)
          "
        />
        @if (c.t === 'door-locked') {
          <circle class="lock" [attr.cx]="c.x * C + 24" [attr.cy]="c.y * C + 24" r="5" />
        }
      }
      @if (c.t === 'water') {
        <path
          class="wave"
          [attr.d]="
            'M' +
            (c.x * C + 8) +
            ' ' +
            (c.y * C + 18) +
            'q6 -6 12 0t12 0 M' +
            (c.x * C + 8) +
            ' ' +
            (c.y * C + 32) +
            'q6 -6 12 0t12 0'
          "
        />
      }
    }

    @if (texture() !== 'none') {
      <rect
        class="texture"
        [attr.width]="width()"
        [attr.height]="height()"
        [attr.fill]="'url(#tex-' + texture() + ')'"
      />
    }

    @for (r of reach(); track r.x + ',' + r.y) {
      <rect
        class="reach"
        [attr.x]="r.x * C + 2"
        [attr.y]="r.y * C + 2"
        [attr.width]="C - 4"
        [attr.height]="C - 4"
        rx="4"
      />
    }

    @for (f of fogList(); track f.i) {
      <rect class="fog" [attr.x]="f.x * C" [attr.y]="f.y * C" [attr.width]="C" [attr.height]="C" />
    }

    @for (r of rooms(); track r.id) {
      <g class="room" [class.sel]="r.id === selectedRoom()" aria-hidden="true">
        <rect
          [attr.x]="r.x * C + 2"
          [attr.y]="r.y * C + 2"
          [attr.width]="r.w * C - 4"
          [attr.height]="r.h * C - 4"
          rx="4"
        />
        <text [attr.x]="r.x * C + 8" [attr.y]="r.y * C + 18" font-size="13">{{ r.name }}</text>
      </g>
    }

    @if (draftRect(); as d) {
      <rect
        class="draft"
        [attr.x]="d.x * C + 2"
        [attr.y]="d.y * C + 2"
        [attr.width]="d.w * C - 4"
        [attr.height]="d.h * C - 4"
        rx="4"
      />
    }

    @for (portal of map().portals ?? []; track portal.id) {
      <g class="portal" aria-hidden="true">
        <rect
          [attr.x]="portal.pos.x * C + 10"
          [attr.y]="portal.pos.y * C + 10"
          [attr.width]="C - 20"
          [attr.height]="C - 20"
          rx="3"
        />
        <path
          [attr.d]="
            'M' + (portal.pos.x * C + 17) + ' ' + (portal.pos.y * C + 24) + 'h14m-5-5 5 5-5 5'
          "
        />
      </g>
    }

    @for (t of visibleTraps(); track t.id) {
      <g
        class="trap"
        [class.hid]="t.hidden && !t.triggered"
        [class.spent]="t.triggered"
        aria-hidden="true"
      >
        <path [attr.d]="'M' + (t.pos.x * C + 24) + ' ' + (t.pos.y * C + 9) + 'l14 26h-28z'" />
        <text
          [attr.x]="t.pos.x * C + 24"
          [attr.y]="t.pos.y * C + 32"
          text-anchor="middle"
          font-size="14"
        >
          !
        </text>
      </g>
    }

    @if (sphere(); as sp) {
      <circle class="aoe" [attr.cx]="sp.cx" [attr.cy]="sp.cy" [attr.r]="sp.r" />
    }
    @if (cone(); as pts) {
      <polygon class="aoe" [attr.points]="pts" />
    }

    @if (path(); as pth) {
      <polyline class="path" [attr.points]="pathPoints()" />
      @if (pathEnd(); as e) {
        <g class="path-label" aria-hidden="true">
          <rect [attr.x]="e.x - 26" [attr.y]="e.y - 16" width="52" height="20" rx="4" />
          <text [attr.x]="e.x" [attr.y]="e.y" text-anchor="middle">{{ pth.label }}</text>
        </g>
      }
    }
    @if (rulerShape(); as r) {
      <line class="ruler" [attr.x1]="r.x1" [attr.y1]="r.y1" [attr.x2]="r.x2" [attr.y2]="r.y2" />
      <g class="path-label" aria-hidden="true">
        <rect [attr.x]="r.mx - 30" [attr.y]="r.my - 15" width="60" height="20" rx="4" />
        <text [attr.x]="r.mx" [attr.y]="r.my" text-anchor="middle">{{ r.label }}</text>
      </g>
    }

    @for (pg of pings(); track pg.id) {
      <g class="ping" aria-hidden="true">
        <circle [attr.cx]="pg.pos.x * C + C / 2" [attr.cy]="pg.pos.y * C + C / 2" r="6" />
        <text [attr.x]="pg.pos.x * C + C / 2" [attr.y]="pg.pos.y * C - 4" text-anchor="middle">
          {{ pg.from }}
        </text>
      </g>
    }

    @for (t of tokens(); track t.id) {
      @let p = place(t);
      @let d = t.size * C;
      <g
        class="token"
        [class.foe]="t.team === 'foes'"
        [class.hidden]="t.hidden"
        [class.dead]="t.dead"
        [class.dragging]="drag()?.id === t.id && drag()?.moved"
        [attr.transform]="'translate(' + p.x + ' ' + p.y + ')'"
        [attr.data-token]="t.id"
        tabindex="0"
        role="button"
        [attr.aria-label]="label(t)"
        [attr.aria-pressed]="t.selected"
        (keydown)="onKey($event, t)"
      >
        @if (t.active) {
          <circle class="turn" [attr.cx]="d / 2" [attr.cy]="d / 2" [attr.r]="d / 2 + 1" />
        }
        @if (t.targetable) {
          <circle class="target" [attr.cx]="d / 2" [attr.cy]="d / 2" [attr.r]="d / 2" />
        }
        @if (t.selected) {
          <circle class="sel" [attr.cx]="d / 2" [attr.cy]="d / 2" [attr.r]="d / 2 - 1" />
        }
        <circle class="body" [attr.cx]="d / 2" [attr.cy]="d / 2" [attr.r]="d / 2 - 5" />
        @if (t.icon && !t.dead) {
          <g
            class="icon"
            aria-hidden="true"
            [attr.transform]="
              'translate(' +
              d / 2 +
              ' ' +
              (d / 2 - 3) +
              ') scale(' +
              d / 34 +
              ') translate(-12 -12)'
            "
          >
            <path [attr.d]="iconPath[t.icon]" />
          </g>
        } @else {
          <text
            [attr.x]="d / 2"
            [attr.y]="d / 2 + d * 0.13"
            [attr.font-size]="d * 0.42"
            text-anchor="middle"
          >
            {{ t.dead ? '✕' : t.letter }}
          </text>
        }
        <rect
          class="hp-bg"
          [attr.x]="d * 0.2"
          [attr.y]="d - 8"
          [attr.width]="d * 0.6"
          height="5"
          rx="2"
        />
        <rect
          class="hp"
          [class.low]="t.hpPct <= 25"
          [attr.x]="d * 0.2"
          [attr.y]="d - 8"
          [attr.width]="(d * 0.6 * t.hpPct) / 100"
          height="5"
          rx="2"
        />
        @if (t.conditions > 0) {
          <g class="badge" aria-hidden="true">
            <circle [attr.cx]="d - 9" cy="9" r="8" />
            <text [attr.x]="d - 9" y="13" text-anchor="middle" font-size="11">
              {{ t.conditions }}
            </text>
          </g>
        }
        @if (t.concentrating) {
          <circle
            class="focus"
            [attr.cx]="d / 2"
            [attr.cy]="d / 2"
            [attr.r]="d / 2 + 2"
            aria-hidden="true"
          />
        }
      </g>
    }
  </svg>

  <div class="zoom" role="group" [attr.aria-label]="ui.text('Zoom do mapa', 'Map zoom')">
    <button
      type="button"
      [attr.aria-label]="ui.text('Aproximar', 'Zoom in')"
      (click)="zoomBy(1.25)"
    >
      +
    </button>
    <button type="button" [attr.aria-label]="ui.text('Afastar', 'Zoom out')" (click)="zoomBy(0.8)">
      −
    </button>
    <button
      type="button"
      [attr.aria-label]="ui.text('Ajustar ao mapa', 'Fit map')"
      (click)="reset()"
    >
      ⌂
    </button>
  </div>
</div>
